<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard – MailGuard</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css"></head><body><div id="hdr"></div>
<main><h1>Analytics Dashboard</h1>
<section class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><b id="dTot">0</b><span>Saved Analyses</span></div><div class="card"><b id="dAvg">0%</b><span>Average Confidence</span></div><div class="card"><b id="dLinks">0</b><span>Suspicious Links Found</span></div></section>
<section class="grid2"><div class="card"><h2>Classification distribution</h2><div id="dDist"></div></div><div class="card"><h2>Analyses in the last 7 days</h2><div id="dDays"></div></div></section>
<section class="card"><h2>Model information</h2><div id="dModel"></div></section></main>
<script src="js/main.js"></script><script src="js/dashboard.js"></script></body></html>
